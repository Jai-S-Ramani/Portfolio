    <script>
      (function() {
        try {
          var mode = localStorage.getItem('editorial_theme_mode');
          var isDark = false;
          if (mode === 'dark') {
            isDark = true;
          } else if (mode === 'light') {
            isDark = false;
          } else {
            // Auto / Dynamic: follow Browser & System theme preference first
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
              isDark = true;
            } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
              isDark = false;
            } else {
              var hour = new Date().getHours();
              isDark = hour >= 18 || hour < 6;
            }
          }

          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.backgroundColor = '#070C09';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.backgroundColor = '#F5F3E9';
          }
        } catch (e) {}
      })();
    </script>
